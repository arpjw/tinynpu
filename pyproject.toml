[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "tinynpu"
version = "0.0.1"
description = "A small, verifiable inference accelerator design lab"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "threadpoolctl>=3.5,<4",
]

[project.urls]
Repository = "https://github.com/arpjw/tinynpu"
Documentation = "https://github.com/arpjw/tinynpu/tree/main/docs"
Demo = "https://tinynpu-lab.vercel.app"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tinynpu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
